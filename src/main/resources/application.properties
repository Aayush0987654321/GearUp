spring.application.name=car_management

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Application logging
logging.level.com.example.car_management=INFO

# Write application logs to a file
logging.file.name=logs/car-management.log

# Rotate the log file when it reaches 10 MB
logging.logback.rollingpolicy.max-file-size=10MB

# Retain up to seven archived log files
logging.logback.rollingpolicy.max-history=7

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000